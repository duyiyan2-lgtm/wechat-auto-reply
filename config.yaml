# 微信 PC 离线留言自动回复配置
# 改完保存即可，下次启动或按说明热加载前先停掉脚本再开。

# 离线留言正文（对方会原样收到）
message: |-
  [自动回复] 我现在不在电脑前，看到消息后会尽快回复。

# 同一联系人多少分钟内只回一次，避免连发刷屏
cooldown_minutes: 60

# 扫描会话列表的间隔（秒）。太小会频繁抢鼠标，建议 6–15
poll_interval: 8

# 运行多久后自动退出。例如 2h、30min、0 表示一直运行直到 Ctrl+C
duration: "0"

# 是否回复群聊。离线留言建议 false；群聊设为免打扰后脚本也不会扫到
reply_groups: false

# 白名单：非空时只回复这些备注名（必须和会话列表里完全一致）
allowlist: []

# 黑名单：永远不回复
blocklist:
  - 文件传输助手
  - 微信团队
  - 微信支付
  - 腾讯新闻
  - 服务通知
  - 订阅号消息

# 只在该时段工作。留空表示脚本运行期间一直工作
active_hours:
  start: ""   # 例如 "09:00"
  end: ""     # 例如 "22:00"
